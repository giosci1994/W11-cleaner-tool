name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/W11CleanerTool.Tests/W11CleanerTool.Tests.csproj -c Release --logger "console;verbosity=detailed"

      - name: Publish x64 e ARM64, SHA256
        shell: pwsh
        run: ./scripts/publish.ps1 -Suffix "ci.${{ github.run_number }}"

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: W11-cleaner-tool-ci.${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
